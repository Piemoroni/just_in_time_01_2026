<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Produção JIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <span id="nomeUsuario">Usuário: Carregando...</span>
        <button onclick="sair()">Sair</button>
    </header>

    <div class="topo">
        <button onclick="abrirModalProduto()">+ Novo Produto</button>
        <button onclick="abrirModalProducao()" style="background: #e91e63;">+ Registrar Movimentação</button>
    </div>

    <main>
        <h2>Estoque de Produtos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Estoque Atual</th>
                    <th>Estoque Mínimo</th>
                    <th>Custo</th>
                </tr>
            </thead>
            <tbody id="listaProdutos"></tbody>
        </table>

        <br><br>

        <h2>Histórico de Movimentações JIT</h2>
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Produto</th>
                    <th>Tipo</th>
                    <th>Qtd</th>
                    <th>Usuário</th>
                </tr>
            </thead>
            <tbody id="listaHistorico"></tbody>
        </table>
    </main>

    <!-- Modal Novo Produto -->
    <div id="modalProduto" class="modal oculto">
        <form id="formProduto">
            <h2>Cadastrar Produto</h2>
            <input type="text" id="nomeProduto" placeholder="Nome do Produto" required>
            <input type="text" id="descProduto" placeholder="Descrição">
            <input type="number" step="0.01" id="custoProduto" placeholder="Custo (R$)" required>
            <input type="number" id="estoqueProduto" placeholder="Estoque Inicial" required>
            <input type="number" id="minProduto" placeholder="Estoque Mínimo" required>
            
            <button type="submit">Salvar</button>
            <button type="button" onclick="fecharModalProduto()" style="background: gray; color: white;">Cancelar</button>
        </form>
    </div>

    <!-- Modal Registrar Movimentação JIT -->
    <div id="modalProducao" class="modal oculto">
        <form id="formProducao">
            <h2>Registrar Movimentação</h2>
            <select id="selectProduto" required style="padding: 12px; border-radius: 5px; border: 1px solid #ccc;">
                <option value="">Selecione o Produto</option>
            </select>
            <select id="tipoMovimentacao" required style="padding: 12px; border-radius: 5px; border: 1px solid #ccc;">
                <option value="FABRICADO">FABRICADO (Entrada / Soma)</option>
                <option value="PEDIDO">PEDIDO (Saída / Subtração)</option>
            </select>
            <input type="number" id="qntdMovimentacao" placeholder="Quantidade" required>

            <button type="submit">Confirmar Movimentação</button>
            <button type="button" onclick="fecharModalProducao()" style="background: gray; color: white;">Cancelar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
